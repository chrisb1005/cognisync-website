<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CogniSync Blog</title>
    <link rel="stylesheet" href="/blog_app/static/styles.css">
  </head>
  <body>
    <div class="container">
      <h1>CogniSync Blog</h1>
      <ul>
        {% for p in posts %}
        <li><a href="{{ url_for('post', slug=p.slug) }}">{{ p.title }}</a></li>
        {% else %}
        <li>No posts yet.</li>
        {% endfor %}
      </ul>
      <p><a href="/">Back to site</a></p>
    </div>
  </body>
</html>
